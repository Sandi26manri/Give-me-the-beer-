<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Give me more beer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Give me more beer🍻</h1>
  <button id="soundBtn">🔊</button>
    <div id="nameRow">
    <input id="nameInput" maxlength="10" placeholder="이름 · Name">
    <button id="saveNameBtn">저장</button>
    </div>
  <p id="target"></p>
  <p id="hint"></p>

  <svg id="scene" viewBox="0 -110 422 530">
    <defs>
      <filter id="pencil" x="-20%" y="-5%" width="140%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="1" seed="5" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
      </filter>

      <clipPath id="inside">
        <path d="M56,36 L184,36 L168,382 L72,382 Z"/>
      </clipPath>

      <linearGradient id="beerGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f6c15c"/>
        <stop offset="1" stop-color="#dc8e22"/>
      </linearGradient>
      <linearGradient id="shadeL" x1="0" x2="1">
        <stop offset="0" stop-color="#9fb3c8" stop-opacity="0.75"/>
        <stop offset="1" stop-color="#9fb3c8" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="shadeR" x1="1" x2="0">
        <stop offset="0" stop-color="#f0c9a0" stop-opacity="0.8"/>
        <stop offset="1" stop-color="#f0c9a0" stop-opacity="0"/>
      </linearGradient>
      <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="7" stroke="rgba(120,60,0,0.18)" stroke-width="2"/>
      </pattern>
    </defs>

    <!-- the beer machine -->
    <g filter="url(#pencil)" stroke="#2b3440" stroke-width="2.5" stroke-linejoin="round">
      <rect x="228" y="-84" width="106" height="94" rx="6" fill="#efe3cf"/>
      <rect x="108" y="-46" width="130" height="18" rx="7" fill="#d9c7a8"/>
      <path d="M113,-28 L113,-4 Q120,2 127,-4 L127,-28 Z" fill="#d9c7a8"/>
    </g>
    <text class="machineText" x="281" y="-50">MANRI</text>
    <text class="machineText big" x="281" y="-20">199</text>

    <!-- the handle: this is what the player taps -->
    <g id="handleG" filter="url(#pencil)">
      <rect x="175" y="-96" width="20" height="50" rx="7" fill="#d9603b" stroke="#2b3440" stroke-width="2.5"/>
      <circle cx="185" cy="-46" r="6" fill="#efe3cf" stroke="#2b3440" stroke-width="2.5"/>
    </g>
    <circle id="ring" cx="185" cy="-74" r="30" fill="none" stroke="#d9603b" stroke-width="3" stroke-dasharray="6 5"/>

    <!-- the glass, back part -->
    <path d="M48,30 L64,394 Q120,408 176,394 L192,30 Z" fill="#e8eff6" fill-opacity="0.55"/>
    <ellipse cx="120" cy="30" rx="72" ry="9" fill="#e6eef6"/>

    <!-- everything inside this group is cut to the inside of the glass -->
    <g clip-path="url(#inside)">
      <rect id="beer" x="40" y="382" width="170" height="0" fill="url(#beerGrad)"/>
      <rect id="beerHatch" x="40" y="382" width="170" height="0" fill="url(#hatch)"/>
       <g id="bubbles"></g>
      <rect id="foam" x="40" y="382" width="170" height="0" rx="8" fill="#fff7e6" stroke="#b79a6a" stroke-width="1.5" visibility="hidden"/>     
      <rect x="56" y="36" width="24" height="346" fill="url(#shadeL)"/>
      <rect x="150" y="36" width="40" height="346" fill="url(#shadeR)"/>
      <path d="M82,46 L90,366" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/>
      <path d="M158,56 L152,226" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- the beer stream from the nozzle -->
    <line id="streamLine" x1="120" y1="-4" x2="120" y2="-4" visibility="hidden"/>

    <!-- the words printed on the cup -->
    <text class="cupLabel" x="120" y="92">서울역</text>
    <text class="cupLabel" x="120" y="118">라거</text>

    <!-- the pencil outline -->
    <g id="outline" filter="url(#pencil)" fill="none" stroke="#2b3440" stroke-linecap="round" stroke-linejoin="round">
      <path d="M48,30 L64,394 Q120,408 176,394 L192,30" stroke-width="2.6"/>
      <ellipse cx="120" cy="30" rx="72" ry="9" stroke-width="2.2"/>
      <ellipse cx="120" cy="382" rx="44" ry="8" stroke="#8aa0b6" stroke-width="1.6"/>
    </g>

    <!-- the ml marks are added here by script.js -->
    <g id="ticks"></g>

    <!-- the records board beside the cup -->
    <g id="board"></g>

    <text id="number" x="120" y="200">0 ml</text>

    <!-- a big invisible area around the handle, so it is easy to tap -->
    <rect id="hit" x="140" y="-110" width="100" height="90" fill="transparent"/>
  </svg>

  <div id="result" hidden>
    <p id="resultText"></p>
    <button id="retryBtn">다시 · Try again</button>
  </div>

  <p id="credit">made by Sandi</p>
<p id="tagline">Don't just stand there, come in! </p>
  <script src="script.js"></script>
</body>
</html>
